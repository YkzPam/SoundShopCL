<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2080" viewBox="0 0 1600 2080" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de flujo de SoundShop CL</title>
  <desc id="desc">Flujo principal desde la portada hasta la confirmación del pedido, incluyendo búsqueda, validación de producto y stock, inicio de sesión obligatorio, cantidad y carrito.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#12213a"/></linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4f75ff"/><stop offset="1" stop-color="#2446bd"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#26c6b8"/><stop offset="1" stop-color="#315bea"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".32"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#718096"/></marker>
    <style>
      .box{fill:#111c2e;stroke:#40516c;stroke-width:2;filter:url(#shadow)}
      .decision{fill:#182742;stroke:#6d92ff;stroke-width:2;filter:url(#shadow)}
      .line{fill:none;stroke:#718096;stroke-width:3;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#607087;stroke-width:2.5;stroke-dasharray:10 9;marker-end:url(#arrow)}
      .h{font:700 24px 'Bahnschrift','Segoe UI',sans-serif;fill:#f8fafc;text-anchor:middle}
      .p{font:400 17px 'Aptos','Segoe UI',sans-serif;fill:#afbdd2;text-anchor:middle}
      .small{font:700 15px 'Aptos','Segoe UI',sans-serif;fill:#bfd0ff;text-anchor:middle}
      .label{font:700 16px 'Aptos','Segoe UI',sans-serif;fill:#a7b5ca}
      .lane{font:700 14px 'Aptos','Segoe UI',sans-serif;fill:#7890b2;letter-spacing:2px;text-transform:uppercase}
    </style>
  </defs>

  <rect width="1600" height="2080" rx="34" fill="url(#bg)"/>
  <circle cx="1450" cy="120" r="280" fill="#315bea" opacity=".09"/><circle cx="110" cy="1930" r="290" fill="#24b8aa" opacity=".06"/>
  <text x="800" y="58" font-family="Bahnschrift,Segoe UI,sans-serif" font-size="36" font-weight="800" fill="#fff" text-anchor="middle">Flujo principal · SoundShop CL</text>
  <text x="800" y="91" font-family="Aptos,Segoe UI,sans-serif" font-size="17" fill="#8ea0ba" text-anchor="middle">Catálogo musical, sesión de compra y carrito · Evaluación 1</text>
  <text class="lane" x="70" y="155">Exploración</text><path d="M70 169h125" stroke="#315bea" stroke-width="3"/>

  <rect x="650" y="125" width="300" height="86" rx="43" fill="url(#primary)" filter="url(#shadow)"/>
  <text class="h" x="800" y="162">Inicio</text><text class="p" x="800" y="188" fill="#e2e9ff">Portada y productos destacados</text>
  <path class="line" d="M800 211v49"/>

  <rect class="box" x="610" y="260" width="380" height="100" rx="22"/>
  <text class="h" x="800" y="301">Explorar catálogo</text><text class="p" x="800" y="331">Buscar, filtrar o elegir categoría</text>
  <path class="line" d="M800 360v50"/>

  <path class="decision" d="M800 410l165 80-165 80-165-80z"/>
  <text class="h" x="800" y="482">¿Hay resultados?</text><text class="small" x="800" y="508">Consulta sobre datos JSON</text>
  <path class="dash" d="M635 490H480"/><text class="label" x="535" y="474">No</text>
  <rect class="box" x="140" y="435" width="340" height="110" rx="22"/>
  <text class="h" x="310" y="477">Sin coincidencias</text><text class="p" x="310" y="507">Limpiar o cambiar los filtros</text>
  <path class="dash" d="M310 435V310H610"/>
  <path class="line" d="M800 570v55"/><text class="label" x="820" y="601">Sí</text>

  <rect class="box" x="610" y="625" width="380" height="100" rx="22"/>
  <text class="h" x="800" y="666">Seleccionar producto</text><text class="p" x="800" y="696">Vista rápida o ficha completa</text>
  <path class="line" d="M800 725v35"/>

  <path class="decision" d="M800 760l150 75-150 75-150-75z"/>
  <text class="h" x="800" y="827">¿ID válido?</text><text class="small" x="800" y="853">Vista Django</text>
  <path class="dash" d="M950 835h160"/><text class="label" x="1020" y="819">No</text>
  <rect class="box" x="1110" y="780" width="350" height="110" rx="22"/>
  <text class="h" x="1285" y="822">Aviso controlado</text><text class="p" x="1285" y="852">Mensaje y regreso al catálogo</text>
  <path class="dash" d="M1285 780V310H990"/>
  <path class="line" d="M800 910v45"/><text class="label" x="820" y="936">Sí</text>

  <rect class="box" x="610" y="955" width="380" height="100" rx="22"/>
  <text class="h" x="800" y="996">Ficha del producto</text><text class="p" x="800" y="1026">Precio, fotografía y especificaciones</text>
  <path class="line" d="M800 1055v35"/>

  <path class="decision" d="M800 1090l150 75-150 75-150-75z"/>
  <text class="h" x="800" y="1157">¿Tiene stock?</text><text class="small" x="800" y="1183">Disponibilidad visible</text>
  <path class="dash" d="M650 1165H480"/><text class="label" x="535" y="1149">No</text>
  <rect class="box" x="140" y="1110" width="340" height="110" rx="22"/>
  <text class="h" x="310" y="1152">Producto agotado</text><text class="p" x="310" y="1182">Compra deshabilitada</text>
  <path class="dash" d="M310 1110V310H610"/>
  <path class="line" d="M800 1240v35"/><text class="label" x="820" y="1260">Sí</text>

  <text class="lane" x="70" y="1308">Acceso requerido</text><path d="M70 1322h175" stroke="#24b8aa" stroke-width="3"/>
  <path class="decision" d="M800 1275l150 75-150 75-150-75z"/>
  <text class="h" x="800" y="1342">¿Sesión activa?</text><text class="small" x="800" y="1368">Cookie firmada · sin base de datos</text>
  <path class="line" d="M950 1350h160"/><text class="label" x="1010" y="1334">No</text>
  <rect class="box" x="1110" y="1295" width="350" height="110" rx="22"/>
  <text class="h" x="1285" y="1337">Crear cuenta</text><text class="p" x="1285" y="1367">Nombre, correo y contraseña</text>
  <path class="line" d="M1285 1405v35"/>

  <path class="decision" d="M1285 1440l145 70-145 70-145-70z"/>
  <text class="h" x="1285" y="1503">¿Datos válidos?</text><text class="small" x="1285" y="1529">Formulario con CSRF</text>
  <path class="dash" d="M1430 1510h85v-160h-55"/><text class="label" x="1460" y="1492">No</text>
  <path class="line" d="M1285 1580v35"/><text class="label" x="1305" y="1602">Sí</text>
  <rect x="1110" y="1615" width="350" height="100" rx="22" fill="url(#accent)" filter="url(#shadow)"/>
  <text class="h" x="1285" y="1656">Sesión iniciada</text><text class="p" x="1285" y="1686" fill="#e2f8f6">Nombre visible en el menú</text>
  <path class="dash" d="M1110 1665h-90v-315h-70"/>

  <path class="line" d="M800 1425v35"/><text class="label" x="820" y="1446">Sí</text>
  <path class="decision" d="M800 1460l150 75-150 75-150-75z"/>
  <text class="h" x="800" y="1527">¿Cantidad válida?</text><text class="small" x="800" y="1553">1 ≤ cantidad ≤ stock</text>
  <path class="dash" d="M650 1535H545V1005h65"/><text class="label" x="560" y="1519">No: corregir</text>
  <path class="line" d="M800 1610v45"/><text class="label" x="820" y="1637">Sí</text>

  <text class="lane" x="70" y="1690">Pedido</text><path d="M70 1704h86" stroke="#315bea" stroke-width="3"/>
  <rect x="610" y="1655" width="380" height="100" rx="22" fill="url(#accent)" filter="url(#shadow)"/>
  <text class="h" x="800" y="1696">Carrito</text><text class="p" x="800" y="1726" fill="#e2f8f6">Revisar, actualizar o eliminar</text>
  <path class="line" d="M800 1755v45"/>

  <rect class="box" x="610" y="1800" width="380" height="100" rx="22"/>
  <text class="h" x="800" y="1841">Confirmar pedido</text><text class="p" x="800" y="1871">Total validado · POST + CSRF</text>
  <path class="line" d="M800 1900v50"/>

  <rect x="590" y="1950" width="420" height="92" rx="46" fill="url(#primary)" filter="url(#shadow)"/>
  <text class="h" x="800" y="1989">Pedido confirmado</text><text class="p" x="800" y="2017" fill="#e2e9ff">Código, cantidad, total y fecha</text>
</svg>
