{% extends 'base.html' %}
{% block contenido %}
<section class="acceso">
<p class="eyebrow">Administración / SoundShop CL</p><h1>Iniciar sesión</h1><p>Acceso a la gestión de la tienda.</p>
{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
<form method="post">{% csrf_token %}
<input type="hidden" name="next" value="{{ siguiente }}">
<div class="mb-3"><label for="username" class="form-label">Usuario</label><input class="form-control" id="username" name="username" value="{{ nombre_usuario }}" autocomplete="username" required autofocus></div>
<div class="mb-3"><label for="password" class="form-label">Contraseña</label><input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required></div>
<button class="btn btn-primary w-100" type="submit">Ingresar</button></form>
<p class="mt-3">Las cuentas son administradas por el personal autorizado.</p>
</section>
{% endblock %}
