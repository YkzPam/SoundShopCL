{% if formulario.non_field_errors %}<div class="alert alert-danger" role="alert">{{ formulario.non_field_errors }}</div>{% endif %}
{% for campo in formulario %}
  <div class="mb-3">
    {{ campo.label_tag }}
    {{ campo }}
    {% if campo.help_text %}<small class="text-body-secondary">{{ campo.help_text }}</small>{% endif %}
    {% if campo.errors %}<div class="errores" role="alert">{{ campo.errors }}</div>{% endif %}
  </div>
{% endfor %}
