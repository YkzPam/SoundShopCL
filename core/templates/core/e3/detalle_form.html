{% extends 'core/e3/base_gestion.html' %}
{% load l10n moneda %}
{% block gestion %}

<div class="cabecera"><p class="eyebrow">Venta {{ venta.numero }}</p><h1>{{ titulo }}</h1></div>
{% include 'core/e3/errores.html' %}
<form method="post" class="form-panel">{% csrf_token %}
<label class="form-label" for="producto">Producto</label><select class="form-select mb-3" id="producto" name="producto" required><option value="">Seleccionar producto</option>{% for producto in productos %}<option value="{{ producto.id }}" {% if detalle.producto_id|stringformat:'s' == producto.id|stringformat:'s' %}selected{% endif %}>{{ producto.codigo }} · {{ producto.nombre }} · Catálogo: ${{ producto.precio|pesos }}</option>{% endfor %}</select>
<div class="row g-3"><div class="col-md-6"><label class="form-label" for="cantidad">Cantidad</label><input class="form-control" id="cantidad" name="cantidad" type="number" min="1" required value="{{ detalle.cantidad|default_if_none:''|unlocalize }}"></div>
<div class="col-md-6"><label class="form-label" for="precio">Precio unitario de la venta</label><input class="form-control" id="precio" name="precio_unitario" type="number" min="1" step="0.01" required value="{{ detalle.precio_unitario|default_if_none:''|unlocalize }}"><p class="form-text">Ingresar sin puntos de miles; por ejemplo, 20990.</p></div></div>
<button class="btn btn-primary mt-3" type="submit">Guardar detalle</button> <a class="btn btn-outline-secondary mt-3" href="{% url 'core:venta_detalle' venta.id %}">Volver</a>
</form>
{% endblock %}
