{% if pagina.has_other_pages %}<nav class="d-flex justify-content-between align-items-center mt-3" aria-label="Páginas de resultados">
{% if pagina.has_previous %}<a class="btn btn-outline-primary btn-sm" href="{% querystring page=pagina.previous_page_number %}">Anterior</a>{% else %}<span></span>{% endif %}
<span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }} · {{ pagina.paginator.count }} registros</span>
{% if pagina.has_next %}<a class="btn btn-outline-primary btn-sm" href="{% querystring page=pagina.next_page_number %}">Siguiente</a>{% else %}<span></span>{% endif %}
</nav>{% endif %}
