{% extends 'core/e3/base_gestion.html' %}{% block gestion %}<h1>{{ titulo }}</h1><p>Las cuentas nuevas reciben el perfil Operador. La cuenta administradora conserva el control de usuarios, catálogo y eliminaciones.</p>{% include 'core/e3/errores.html' %}
<form method="post" class="row g-3">{% csrf_token %}<div class="col-md-6"><label class="form-label" for="username">Usuario</label><input class="form-control" id="username" name="username" value="{{ usuario.username }}" maxlength="150" required></div><div class="col-md-6"><label class="form-label" for="email">Correo</label><input class="form-control" type="email" id="email" name="email" value="{{ usuario.email }}"></div><div class="col-md-6"><label class="form-label" for="first_name">Nombre</label><input class="form-control" id="first_name" name="first_name" value="{{ usuario.first_name }}" maxlength="150"></div><div class="col-md-6"><label class="form-label" for="last_name">Apellido</label><input class="form-control" id="last_name" name="last_name" value="{{ usuario.last_name }}" maxlength="150"></div>
<div class="col-md-6"><label class="form-label" for="password">Contraseña{% if not nuevo %} (dejar vacía para conservarla){% endif %}</label><input class="form-control" type="password" id="password" name="password" autocomplete="new-password" {% if nuevo %}required{% endif %}></div><div class="col-md-6"><label class="form-label" for="confirmar">Repetir contraseña</label><input class="form-control" type="password" id="confirmar" name="confirmar" autocomplete="new-password" {% if nuevo %}required{% endif %}></div><div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" id="is_active" name="is_active" {% if usuario.is_active %}checked{% endif %}><label class="form-check-label" for="is_active">Cuenta activa</label></div><div class="col-12"><button class="btn btn-primary">Guardar usuario</button> <a class="btn btn-outline-primary" href="{% url 'core:gestion_usuarios' %}">Cancelar</a></div></form>{% endblock %}
