{% extends 'core/e3/base_gestion.html' %}{% block gestion %}
<div class="d-flex justify-content-between mb-4"><h1>Categorías</h1><a class="btn btn-primary" href="{% url 'core:categoria_nueva' %}">Nueva categoría</a></div>
<div class="table-responsive"><table class="table"><thead><tr><th>Nombre</th><th>Identificador de URL</th><th>Descripción</th><th>Acciones</th></tr></thead><tbody>{% for c in categorias %}<tr><td>{{ c.nombre }}</td><td>{{ c.slug }}</td><td>{{ c.descripcion }}</td><td><a href="{% url 'core:categoria_editar' c.pk %}">Editar</a> · <a href="{% url 'core:categoria_eliminar' c.pk %}">Eliminar</a></td></tr>{% empty %}<tr><td colspan="4">No hay categorías.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
