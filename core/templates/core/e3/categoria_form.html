{% extends 'core/e3/base_gestion.html' %}{% block gestion %}<h1>{{ titulo }}</h1>{% include 'core/e3/errores.html' %}
<form method="post" class="acceso">{% csrf_token %}<div class="mb-3"><label for="nombre" class="form-label">Nombre</label><input class="form-control" id="nombre" name="nombre" value="{{ categoria.nombre }}" maxlength="80" required></div><div class="mb-3"><label for="slug" class="form-label">Identificador de URL (opcional; se obtiene del nombre)</label><input class="form-control" id="slug" name="slug" value="{{ categoria.slug }}" maxlength="80"></div><div class="mb-3"><label for="descripcion" class="form-label">Descripción</label><textarea class="form-control" id="descripcion" name="descripcion">{{ categoria.descripcion }}</textarea></div><button class="btn btn-primary">Guardar categoría</button> <a class="btn btn-outline-primary" href="{% url 'core:gestion_categorias' %}">Cancelar</a></form>{% endblock %}
