{% extends 'core/e3/base_gestion.html' %}
{% load l10n %}
{% block gestion %}

<div class="cabecera"><p class="eyebrow">Ventas</p><h1>{{ titulo }}</h1></div>
{% include 'core/e3/errores.html' %}
<form method="post" class="form-panel">{% csrf_token %}
<div class="row g-3">
<div class="col-md-6"><label class="form-label" for="numero">Número de venta</label><input class="form-control" id="numero" name="numero" type="number" min="1" required value="{{ venta.numero|default_if_none:''|unlocalize }}"></div>
<div class="col-md-6"><label class="form-label" for="fecha">Fecha</label><input class="form-control" id="fecha" name="fecha" type="date" required value="{{ fecha_formulario }}"></div>
<div class="col-md-6"><label class="form-label" for="cliente">Cliente</label><select class="form-select" id="cliente" name="cliente" required><option value="">Seleccionar cliente</option>{% for persona in clientes %}<option value="{{ persona.id }}" {% if venta.cliente_id|stringformat:'s' == persona.id|stringformat:'s' %}selected{% endif %}>{{ persona.nombre }} · {{ persona.correo }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label" for="sucursal">Sucursal</label><select class="form-select" id="sucursal" name="sucursal" required><option value="">Seleccionar sucursal</option>{% for sucursal in sucursales %}<option value="{{ sucursal.id }}" {% if venta.sucursal_id|stringformat:'s' == sucursal.id|stringformat:'s' %}selected{% endif %}>{{ sucursal.nombre }}</option>{% endfor %}</select></div>
</div><p class="mt-3">Después de guardar la venta se agregan los productos, las cantidades y el precio de cada línea.</p>
<button class="btn btn-primary" type="submit">Guardar venta</button> <a class="btn btn-outline-secondary" href="{% url 'core:gestion_ventas' %}">Volver</a>
</form>
{% endblock %}
