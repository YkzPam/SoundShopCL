{% extends 'core/e3/base_gestion.html' %}{% block gestion %}<h1>{{ titulo }}</h1>{% include 'core/e3/errores.html' %}
<form method="post" class="acceso">{% csrf_token %}<div class="mb-3"><label class="form-label" for="nombre">Nombre</label><input class="form-control" id="nombre" name="nombre" value="{{ persona.nombre }}" maxlength="100" required></div><div class="mb-3"><label class="form-label" for="correo">Correo</label><input class="form-control" type="email" id="correo" name="correo" value="{{ persona.correo }}" required></div><div class="mb-3"><label class="form-label" for="telefono">Teléfono</label><input class="form-control" id="telefono" name="telefono" value="{{ persona.telefono }}" maxlength="20"></div><div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="activo" id="activo" {% if persona.activo %}checked{% endif %}><label class="form-check-label" for="activo">Cliente activo</label></div><button class="btn btn-primary">Guardar cliente</button> <a class="btn btn-outline-primary" href="{% url 'core:gestion_clientes' %}">Cancelar</a></form>{% endblock %}
